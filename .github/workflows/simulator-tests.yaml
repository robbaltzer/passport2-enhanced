#
# simulator-tests.yaml - build the Unix simulator and run the module tests,
# including the headless runtime tests and the frozen-manifest guard.

name: Simulator tests
on:
  push:
    branches: [release-2.3.11]
  pull_request:

jobs:
  simulator-tests:
    name: Simulator tests pass?
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev \
            libsdl2-dev python3 python3-pip
          pip3 install pytest pycodestyle==2.15.0 pyparsing

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binaries; compiling them with cargo install took ~1.5 minutes.
      - name: Install just
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: just@1.23.0

      # Mozilla publishes no digest for this asset; the hash is of the binary as
      # downloaded on 2026-11-05. A mismatch fails the job before anything runs.
      - name: Install cbindgen
        run: |
          curl -fsSL -o cbindgen \
            https://github.com/mozilla/cbindgen/releases/download/v0.24.3/cbindgen
          echo "c4e9bc396922939762ee66304cb29316c55b78ef49b51f5a94ec478eb1257e08  cbindgen" \
            | sha256sum -c -
          sudo install -m 755 cbindgen /usr/local/bin/cbindgen
          rm cbindgen
          cbindgen --version

      - name: Build simulator (color)
        run: just simulator/build color

      # Gate: tests that run headless (the dice tests use fixtures/headless.py).
      # test_translations.py fails on the stock v2.3.11 tag and is excluded.
      - name: Run module tests (headless)
        working-directory: ports/stm32/boards/Passport/modules/tests
        run: |
          python3 -m pytest test_dice_entropy.py test_frozen_manifest.py test_enum.py \
            test_sflash.py test_version.py --simulatordir=${{ github.workspace }}/simulator -v

      - name: Lint Python
        run: just ports/stm32/lint-py
